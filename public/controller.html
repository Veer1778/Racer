<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<title>Apex Controller</title>
<style>
  :root{ --bg:#06080f; --ink:#e9edf5; --dim:#7c879c; --accent:#e2334a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font:500 15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;touch-action:none}
  .pane{flex:1;display:none;flex-direction:column}
  .pane.on{display:flex}

  /* pairing */
  #pair{justify-content:center;align-items:center;padding:24px;gap:18px;text-align:center}
  .logo{font:800 30px/1 ui-sans-serif,system-ui;letter-spacing:.22em;color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;max-width:300px}
  input{background:#10141f;border:1px solid #232a3a;color:var(--ink);border-radius:12px;padding:14px;font-size:22px;
        text-align:center;letter-spacing:.3em;text-transform:uppercase;width:200px;font-weight:700}
  button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700}
  button.ghost{background:#161b28;color:var(--ink)}
  .err{color:#ff8087;font-size:13px;min-height:18px}

  /* driving */
  #drive{position:relative}
  .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:12px;color:var(--dim)}
  .chip{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pads{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}
  .pad{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-weight:800;letter-spacing:.14em;font-size:14px;border:1px solid #222a3a;background:#0d1220;color:var(--dim);
       transition:background .06s,color .06s,transform .06s}
  .pad small{font-size:10px;letter-spacing:.1em;margin-top:6px;opacity:.6}
  #brake.hot{background:#3a1220;border-color:#7a2436;color:#ff9aa6}
  #gas.hot{background:#0f2e1c;border-color:#1d6b3c;color:#6ff0a4}
  .pad.hot{transform:scale(.985)}
  .steer{height:74px;margin:0 12px 14px;border-radius:18px;background:#0d1220;border:1px solid #222a3a;position:relative;overflow:hidden}
  .steer .fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:linear-gradient(90deg,#2b3a6b,#4d6bd8);opacity:.75}
  .steer .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2a3346}
  .steer .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.18em;color:var(--dim)}
  .bar{display:flex;gap:10px;padding:0 12px 16px}
  .bar button{flex:1;padding:12px;font-size:13px}
  .mode{font-size:11px;color:var(--dim);text-align:center;padding-bottom:8px}
</style>
</head>
<body>

<div id="pair" class="pane on">
  <div class="logo">APEX</div>
  <div class="sub">Enter the 4-letter room code shown on the race screen, or scan its QR code.</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE">
  <input id="tok" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="KEY" style="font-size:16px;letter-spacing:.2em">
  <div class="err" id="perr"></div>
  <button id="connect">Connect</button>
</div>

<div id="drive" class="pane">
  <div class="top">
    <div class="chip"><span class="dot" id="dot"></span><span id="who">-</span></div>
    <div id="status">connected</div>
  </div>
  <div class="steer" id="steer">
    <div class="mid"></div><div class="fill" id="fill"></div>
    <div class="lbl" id="slbl">TILT TO STEER</div>
  </div>
  <div class="pads">
    <div class="pad" id="brake">BRAKE<small>HOLD</small></div>
    <div class="pad" id="gas">THROTTLE<small>HOLD</small></div>
  </div>
  <div class="bar">
    <button class="ghost" id="calib">Re-centre tilt</button>
    <button class="ghost" id="toggle">Touch steering</button>
    <button class="ghost" id="rejoin">Rejoin</button>
  </div>
  <div class="mode" id="mode">tilt mode · hold the phone in landscape</div>
</div>

<script>
const $ = s => document.querySelector(s);
let ws, pid, sendTimer, keepAlive;
let input = { s:0, g:0, b:0 };
let tiltMode = true, tiltZero = null, tiltRaw = 0, touchSteer = 0;

// ---- pairing from #CODE-TOKEN
const h = decodeURIComponent(location.hash.slice(1));
if (h.includes('-')) { const [c,t] = h.split('-'); $('#code').value = c; $('#tok').value = t; }

$('#connect').onclick = () => connect($('#code').value.trim().toUpperCase(), $('#tok').value.trim().toUpperCase());
if (h.includes('-')) setTimeout(() => $('#connect').click(), 250);

function connect(code, token) {
  if (!code || !token) { $('#perr').textContent = 'Both the code and key are needed.'; return; }
  $('#perr').textContent = 'connecting…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ t:'ctrl', code, token }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'err') { $('#perr').textContent = m.msg; try{ws.close()}catch{} }
    if (m.t === 'paired') {
      $('#pair').classList.remove('on'); $('#drive').classList.add('on');
      $('#who').textContent = m.name + ' · ' + m.driver.name;
      $('#dot').style.background = m.driver.color;
      document.documentElement.style.setProperty('--accent', m.driver.color);
      askTilt();
      clearInterval(sendTimer);
      sendTimer = setInterval(push, 33);
      clearInterval(keepAlive);
      keepAlive = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ t: 'ping', c: 0 })), 8000);
    }
  };
  ws.onclose = () => {
    clearInterval(sendTimer); clearInterval(keepAlive);
    $('#status').textContent = 'disconnected';
    $('#drive').classList.remove('on'); $('#pair').classList.add('on');
    $('#perr').textContent = 'Connection lost. Reconnect below.';
  };
}

function push() {
  if (!ws || ws.readyState !== 1) return;
  const s = tiltMode ? tiltSteer() : touchSteer;
  input.s = Math.max(-1, Math.min(1, s));
  ws.send(JSON.stringify({ t:'in', s:+input.s.toFixed(3), g:input.g, b:input.b }));
  const f = $('#fill'), pct = Math.abs(input.s) * 50;
  f.style.width = pct + '%';
  f.style.left = input.s >= 0 ? '50%' : (50 - pct) + '%';
}

// ---- tilt
function tiltSteer() {
  if (tiltZero === null) return 0;
  let d = tiltRaw - tiltZero;
  if (d > 180) d -= 360; if (d < -180) d += 360;
  const dead = 3, range = 28;
  if (Math.abs(d) < dead) return 0;
  const v = Math.min(1, (Math.abs(d) - dead) / (range - dead));
  // slight curve: precise near centre, full lock at the edges
  return Math.sign(d) * (v * v * 0.55 + v * 0.45);
}

function onOrient(e) {
  // landscape: gamma is the roll axis
  const g = (typeof e.gamma === 'number') ? e.gamma : 0;
  const b = (typeof e.beta === 'number') ? e.beta : 0;
  const landscape = Math.abs(window.orientation || 0) === 90 || window.innerWidth > window.innerHeight;
  tiltRaw = landscape ? b * ((window.orientation === -90) ? -1 : 1) : g;
  if (tiltZero === null) tiltZero = tiltRaw;
}

function askTilt() {
  const start = () => { window.addEventListener('deviceorientation', onOrient, true); };
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') start(); else setTouch(); }).catch(setTouch);
  } else start();
}
function setTouch() { tiltMode = false; $('#mode').textContent = 'touch mode · drag the bar to steer'; $('#slbl').textContent = 'DRAG TO STEER'; $('#toggle').textContent = 'Tilt steering'; }

$('#calib').onclick = () => { tiltZero = tiltRaw; buzz(12); };
$('#rejoin').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'recover' })); buzz(20); };
$('#toggle').onclick = () => {
  tiltMode = !tiltMode;
  if (tiltMode) { askTilt(); $('#mode').textContent = 'tilt mode · hold the phone in landscape'; $('#slbl').textContent = 'TILT TO STEER'; $('#toggle').textContent = 'Touch steering'; }
  else setTouch();
  buzz(12);
};

// ---- pads
function pad(el, key) {
  const on = e => { e.preventDefault(); input[key] = 1; el.classList.add('hot'); buzz(8); };
  const off = e => { e.preventDefault(); input[key] = 0; el.classList.remove('hot'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
pad($('#gas'), 'g');
pad($('#brake'), 'b');

// ---- touch steering bar
const bar = $('#steer');
function barMove(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = bar.getBoundingClientRect();
  touchSteer = Math.max(-1, Math.min(1, ((t.clientX - r.left) / r.width - 0.5) * 2.2));
  if (tiltMode) { tiltMode = false; setTouch(); }
  e.preventDefault();
}
bar.addEventListener('touchstart', barMove, {passive:false});
bar.addEventListener('touchmove', barMove, {passive:false});
bar.addEventListener('touchend', e => { touchSteer = 0; e.preventDefault(); }, {passive:false});
bar.addEventListener('mousedown', barMove);

function buzz(ms){ if (navigator.vibrate) navigator.vibrate(ms); }
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
