<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<title>Apex Controller</title>
<style>
  :root{ --bg:#04050a; --ink:#eef2f8; --dim:#78839a; --accent:#e2334a; --line:#1a2130; --line2:#28324a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:
      repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 2px,transparent 2px 9px),
      radial-gradient(700px 400px at 50% -20%, #16203a 0%, #04050a 65%);
    color:var(--ink);font:500 15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;touch-action:none}
  .pane{flex:1;display:none;flex-direction:column}
  .pane.on{display:flex}
  .label{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

  /* pairing */
  #pair{justify-content:center;align-items:center;padding:22px;gap:14px;text-align:center}
  .logo{font:900 italic 34px/1 ui-sans-serif,system-ui;letter-spacing:.16em}
  .logo s{color:var(--accent);text-decoration:none}
  .sub{color:var(--dim);font-size:12px;max-width:300px;line-height:1.6}
  input{background:#0a0e16;border:1px solid var(--line2);color:var(--ink);padding:13px;font-size:21px;
    text-align:center;letter-spacing:.3em;text-transform:uppercase;width:210px;font-weight:800;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:#161d2b;color:var(--ink);border:0;padding:14px 22px;font-size:13px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
  button.go{background:var(--accent);color:#fff}
  .err{color:#ff8a93;font-size:12px;min-height:17px}

  /* driving */
  #drive{position:relative;padding-bottom:6px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:11px}
  .chip{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px}
  .dot{width:11px;height:11px;border-radius:50% 50% 44% 44%;background:var(--accent)}
  .no{font:900 italic 17px/1 ui-monospace,monospace;color:var(--accent)}

  .steer{height:70px;margin:0 12px 12px;background:#080c13;border:1px solid var(--line);position:relative;overflow:hidden}
  .steer .fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--accent);opacity:.32}
  .steer .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
  .steer .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--dim)}

  .pads{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}
  .pad{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:900;font-style:italic;letter-spacing:.14em;font-size:19px;border:1px solid var(--line);
    background:#080c13;color:var(--dim);transition:.06s;
    clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
  .pad small{font-size:9px;font-style:normal;letter-spacing:.2em;margin-top:7px;opacity:.55}
  #brake.hot{background:#2e0f18;border-color:#7a2436;color:#ff9aa6}
  #gas.hot{background:#0c2a18;border-color:#1d6b3c;color:#6ff0a4}
  .pad.hot{transform:scale(.99)}

  .bar{display:flex;gap:8px;padding:0 12px 10px}
  .bar button{flex:1;padding:11px 6px;font-size:11px;letter-spacing:.06em}
  .mode{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
    text-align:center;padding-bottom:6px}
</style>
</head>
<body>

<div id="pair" class="pane on">
  <div class="logo">APEX<s>//</s></div>
  <div class="sub">Enter the 4-letter room code shown on the race screen, or scan its QR code.</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE">
  <input id="tok" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="KEY" style="font-size:16px;letter-spacing:.2em">
  <div class="err" id="perr"></div>
  <button class="go" id="connect">Connect</button>
</div>

<div id="drive" class="pane">
  <div class="top">
    <div class="chip"><span class="dot" id="dot"></span><span class="no" id="cnum"></span><span id="who">-</span></div>
    <div class="label" id="status">connected</div>
  </div>
  <div class="steer" id="steer">
    <div class="mid"></div><div class="fill" id="fill"></div>
    <div class="lbl" id="slbl">TILT TO STEER</div>
  </div>
  <div class="pads">
    <div class="pad" id="brake">BRAKE<small>HOLD</small></div>
    <div class="pad" id="gas">THROTTLE<small>HOLD</small></div>
  </div>
  <div class="bar">
    <button class="ghost" id="calib">Re-centre tilt</button>
    <button class="ghost" id="toggle">Touch steering</button>
    <button class="ghost" id="rejoin">Rejoin</button>
    <button class="ghost" id="invert">Steering: normal</button>
  </div>
  <div class="mode" id="mode">tilt mode · hold the phone in landscape</div>
</div>

<script>
const $ = s => document.querySelector(s);
let ws, pid, sendTimer, keepAlive;
let input = { s:0, g:0, b:0 };
let tiltMode = true, tiltZero = null, tiltRaw = 0, touchSteer = 0;

// ---- pairing from #CODE-TOKEN
const h = decodeURIComponent(location.hash.slice(1));
if (h.includes('-')) { const [c,t] = h.split('-'); $('#code').value = c; $('#tok').value = t; }

$('#connect').onclick = () => connect($('#code').value.trim().toUpperCase(), $('#tok').value.trim().toUpperCase());
if (h.includes('-')) setTimeout(() => $('#connect').click(), 250);

function connect(code, token) {
  if (!code || !token) { $('#perr').textContent = 'Both the code and key are needed.'; return; }
  $('#perr').textContent = 'connecting…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ t:'ctrl', code, token }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'err') { $('#perr').textContent = m.msg; try{ws.close()}catch{} }
    if (m.t === 'paired') {
      $('#pair').classList.remove('on'); $('#drive').classList.add('on');
      $('#who').textContent = m.name;
      $('#cnum').textContent = m.driver.no ? '#' + m.driver.no : '';
      $('#status').textContent = m.driver.team || 'connected';
      $('#dot').style.background = m.driver.helmet || m.driver.color;
      document.documentElement.style.setProperty('--accent', m.driver.color);
      askTilt();
      clearInterval(sendTimer);
      sendTimer = setInterval(push, 33);
      clearInterval(keepAlive);
      keepAlive = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ t: 'ping', c: 0 })), 8000);
    }
  };
  ws.onclose = () => {
    clearInterval(sendTimer); clearInterval(keepAlive);
    $('#status').textContent = 'disconnected';
    $('#drive').classList.remove('on'); $('#pair').classList.add('on');
    $('#perr').textContent = 'Connection lost. Reconnect below.';
  };
}

function push() {
  if (!ws || ws.readyState !== 1) return;
  const s = tiltMode ? tiltSteer() : touchSteer;
  input.s = Math.max(-1, Math.min(1, s));
  ws.send(JSON.stringify({ t:'in', s:+input.s.toFixed(3), g:input.g, b:input.b }));
  const f = $('#fill'), pct = Math.abs(input.s) * 50;
  f.style.width = pct + '%';
  f.style.left = input.s >= 0 ? '50%' : (50 - pct) + '%';
}

// ---- tilt
// Which axis reads as "roll the phone like a wheel" depends on which way the
// phone was turned into landscape, and the sign flips with it. Read the real
// screen angle rather than the deprecated window.orientation, and keep a manual
// invert for handsets that still disagree.
let invert = localStorage.getItem('apex.invert') === '1';

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
  return innerWidth > innerHeight ? 90 : 0;
}

function tiltSteer() {
  if (tiltZero === null) return 0;
  let d = tiltRaw - tiltZero;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  const dead = 3, range = 26;
  if (Math.abs(d) < dead) return 0;
  const v = Math.min(1, (Math.abs(d) - dead) / (range - dead));
  // precise near centre, full lock at the edges
  return Math.sign(d) * (v * v * 0.55 + v * 0.45) * (invert ? -1 : 1);
}

function onOrient(e) {
  const beta = (typeof e.beta === 'number') ? e.beta : 0;     // front-to-back
  const gamma = (typeof e.gamma === 'number') ? e.gamma : 0;  // left-to-right
  const a = screenAngle();
  // landscape: rolling the phone shows up on beta, signed by which edge is up
  tiltRaw = a === 90 ? -beta : a === 270 ? beta : gamma;
  if (tiltZero === null) tiltZero = tiltRaw;
}

function setInvert(v) {
  invert = v;
  localStorage.setItem('apex.invert', v ? '1' : '0');
  $('#invert').textContent = invert ? 'Steering: inverted' : 'Steering: normal';
}

// iOS only hands over motion data after an explicit grant, and only on HTTPS.
function askTilt() {
  const start = () => {
    tiltZero = null;
    window.addEventListener('deviceorientation', onOrient, true);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission()
      .then(r => { r === 'granted' ? start() : setTouch(); })
      .catch(setTouch);
  } else start();
}

function setTouch() {
  tiltMode = false;
  $('#mode').textContent = 'touch mode · drag the bar to steer';
  $('#slbl').textContent = 'DRAG TO STEER';
  $('#toggle').textContent = 'Tilt steering';
}

$('#calib').onclick = () => { tiltZero = tiltRaw; buzz(12); };

$('#toggle').onclick = () => {
  tiltMode = !tiltMode;
  if (tiltMode) {
    askTilt();
    $('#mode').textContent = 'tilt mode · hold the phone in landscape';
    $('#slbl').textContent = 'TILT TO STEER';
    $('#toggle').textContent = 'Touch steering';
  } else setTouch();
  buzz(12);
};

$('#invert').onclick = () => { setInvert(!invert); buzz(15); };
setInvert(invert);

$('#rejoin').onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'recover' }));
  buzz(20);
};

// ---- pads
function pad(el, key) {
  const on = e => { e.preventDefault(); input[key] = 1; el.classList.add('hot'); buzz(8); };
  const off = e => { e.preventDefault(); input[key] = 0; el.classList.remove('hot'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
pad($('#gas'), 'g');
pad($('#brake'), 'b');

// ---- touch steering bar
const bar = $('#steer');
function barMove(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = bar.getBoundingClientRect();
  touchSteer = Math.max(-1, Math.min(1, ((t.clientX - r.left) / r.width - 0.5) * 2.2));
  if (tiltMode) { tiltMode = false; setTouch(); }
  e.preventDefault();
}
bar.addEventListener('touchstart', barMove, {passive:false});
bar.addEventListener('touchmove', barMove, {passive:false});
bar.addEventListener('touchend', e => { touchSteer = 0; e.preventDefault(); }, {passive:false});
bar.addEventListener('mousedown', barMove);

function buzz(ms){ if (navigator.vibrate) navigator.vibrate(ms); }
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
