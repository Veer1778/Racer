<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<title>Apex Controller</title>
<style>
  /* A controller you hold, not a web page you tap. Everything below is one
     moulded object: textured plastic, recessed wells, buttons with real travel
     and a shadow that collapses under them, brushed metal trim, screen-printed
     labels. The physical cues are what tell a thumb where to go without
     reading anything. */
  :root{
    --case:#2a2d33; --case2:#1b1d21; --case3:#34383f;
    --ink:#e8e2d4; --dim:#8b8d93;
    --red:#c4342f; --green:#3f9e58; --amber:#e8a13a;
    --metal:#9aa0a8; --screw:#4a4f57;
    --print:#d8d2c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;
    -webkit-user-select:none;touch-action:none}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:#0e0f12;
    color:var(--ink);
    font:600 15px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
  }

  /* ---- the case ------------------------------------------------------- */
  .shell{
    flex:1;margin:6px;border-radius:26px;position:relative;display:flex;flex-direction:column;
    background:
      /* moulded plastic grain */
      repeating-linear-gradient(48deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(-42deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),
      linear-gradient(168deg,var(--case3) 0%,var(--case) 42%,var(--case2) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.14),
      inset 0 -3px 0 rgba(0,0,0,.55),
      inset 3px 0 0 rgba(255,255,255,.05),
      inset -3px 0 0 rgba(0,0,0,.35),
      0 14px 34px rgba(0,0,0,.65);
    padding:10px 12px 12px;
  }
  /* the seam where the two halves of the moulding meet */
  .shell::after{
    content:'';position:absolute;left:14px;right:14px;bottom:52px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.45) 12%,rgba(0,0,0,.45) 88%,transparent);
    box-shadow:0 1px 0 rgba(255,255,255,.06);pointer-events:none}
  .screw{position:absolute;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#6b7079,#3a3e45 62%,#23262b);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 1px rgba(0,0,0,.6),0 1px 1px rgba(0,0,0,.4)}
  .screw::before{content:'';position:absolute;inset:4px 2px;border-radius:1px;
    background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.35));transform:rotate(28deg)}
  .screw.tl{top:9px;left:9px} .screw.tr{top:9px;right:9px}
  .screw.bl{bottom:9px;left:9px} .screw.br{bottom:9px;right:9px}

  /* ---- nameplate ------------------------------------------------------ */
  .plate{
    display:flex;align-items:center;gap:10px;margin:0 20px 9px;padding:7px 12px;border-radius:7px;
    background:linear-gradient(180deg,#14161a,#0b0c0f);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08);
  }
  .brand{font:900 italic 15px/1 ui-sans-serif,system-ui;letter-spacing:.15em;color:var(--print);
    text-shadow:0 1px 0 rgba(0,0,0,.9)}
  .brand s{color:var(--red);text-decoration:none}
  .led{width:9px;height:9px;border-radius:50%;background:#3a2d16;flex:none;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.7)}
  .led.on{background:var(--amber);box-shadow:0 0 9px var(--amber),inset 0 1px 1px rgba(255,255,255,.5)}
  .plate .who{margin-left:auto;display:flex;align-items:baseline;gap:8px;min-width:0}
  .plate .no{font:900 italic 16px/1 ui-monospace,monospace;color:var(--red)}
  .plate .nm{font:700 12px/1 ui-sans-serif;letter-spacing:.10em;text-transform:uppercase;
    color:var(--print);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
  .plate .team{font:700 9px/1 ui-sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#6f727a}

  /* ---- the deck: steering | switches | pedals -------------------------- */
  .deck{flex:1;display:grid;grid-template-columns:1.15fr .95fr 1.15fr;gap:10px;min-height:0}

  /* recessed well, the shape every module sits in */
  .well{
    border-radius:13px;padding:9px;position:relative;
    background:linear-gradient(180deg,#15171b,#1d2025);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.75),inset 0 -2px 0 rgba(255,255,255,.05),
               0 1px 0 rgba(255,255,255,.07);
  }
  .cap{position:absolute;top:7px;left:0;right:0;text-align:center;
    font:800 8px/1 ui-sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#6f727a}

  /* ---- steering slot --------------------------------------------------- */
  #steer{display:flex;flex-direction:column;justify-content:center}
  .slot{
    position:relative;height:52px;margin:14px 6px 8px;border-radius:26px;overflow:hidden;
    background:linear-gradient(180deg,#0a0b0e,#141619);
    box-shadow:inset 0 3px 7px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.07);
  }
  .slot .notch{position:absolute;left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px;
    background:rgba(255,255,255,.14);border-radius:2px}
  .knob{
    position:absolute;top:5px;bottom:5px;width:46px;left:50%;margin-left:-23px;border-radius:21px;
    background:linear-gradient(180deg,#b9bfc7,#767c85 52%,#4d525a);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(0,0,0,.45),
               0 3px 6px rgba(0,0,0,.6);
    transition:transform .04s linear;
  }
  .knob::before{content:'';position:absolute;left:50%;top:9px;bottom:9px;width:14px;margin-left:-7px;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px)}
  .tick{display:flex;justify-content:space-between;padding:0 12px;
    font:800 8px/1 ui-sans-serif;letter-spacing:.18em;color:#61646b}

  /* ---- middle column: switches ----------------------------------------- */
  #mid{display:flex;flex-direction:column;gap:7px;justify-content:center;padding-top:14px}
  .sw{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
    background:linear-gradient(180deg,#2e3238,#212429);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.5),0 2px 3px rgba(0,0,0,.45);
  }
  .sw .rock{
    width:34px;height:19px;border-radius:5px;flex:none;position:relative;
    background:linear-gradient(180deg,#101216,#1a1d22);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.85);
  }
  .sw .rock i{
    position:absolute;top:2px;bottom:2px;left:2px;width:15px;border-radius:3px;
    background:linear-gradient(180deg,#9aa0a8,#5e646d);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.6);
    transition:left .09s cubic-bezier(.4,1.6,.5,1);
  }
  .sw.on .rock i{left:17px;background:linear-gradient(180deg,#f0b356,#c47f22)}
  .sw .txt{font:800 9px/1.25 ui-sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--print)}
  .sw .txt b{display:block;font-size:8px;letter-spacing:.10em;color:#6f727a;font-weight:700}

  /* momentary push buttons in the middle column */
  .push{
    border:0;border-radius:8px;padding:9px 6px;color:var(--print);
    font:800 9px/1 ui-sans-serif;letter-spacing:.18em;text-transform:uppercase;
    background:linear-gradient(180deg,#3a3f47,#262a30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #15171b,0 5px 7px rgba(0,0,0,.5);
    transition:transform .04s,box-shadow .04s;
  }
  .push:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 #15171b,0 1px 3px rgba(0,0,0,.6)}
  .push.pit{color:#ffd9a0}

  /* ---- pedals ---------------------------------------------------------- */
  #pedals{display:flex;flex-direction:column;gap:9px;padding-top:15px}
  .pedal{
    flex:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;position:relative;
    font:900 italic 15px/1 ui-sans-serif;letter-spacing:.12em;
    transition:transform .045s,box-shadow .045s,filter .045s;
  }
  .pedal small{font:700 8px/1 ui-sans-serif;font-style:normal;letter-spacing:.20em;opacity:.65}
  .pedal.gas{
    color:#eafbef;
    background:linear-gradient(180deg,#54b46e,#2f7b47 58%,#245f38);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.35),
               0 6px 0 #17301f,0 9px 12px rgba(0,0,0,.55);
  }
  .pedal.brake{
    color:#ffe6e4;
    background:linear-gradient(180deg,#d4544c,#9c2b26 58%,#7a2019);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.35),
               0 6px 0 #3a1310,0 9px 12px rgba(0,0,0,.55);
  }
  .pedal.hot{transform:translateY(6px);filter:brightness(1.12)}
  .pedal.gas.hot{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 #17301f,0 2px 5px rgba(0,0,0,.6)}
  .pedal.brake.hot{box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 0 0 #3a1310,0 2px 5px rgba(0,0,0,.6)}
  /* moulded grip ribs across the pedal face */
  .pedal::after{content:'';position:absolute;inset:8px 16px;border-radius:7px;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 2px,transparent 2px 8px)}

  /* ---- reverse, called out because it changes what the throttle does ---- */
  .sw.rev.on{background:linear-gradient(180deg,#5a4526,#3a2c17);
    box-shadow:inset 0 1px 0 rgba(255,220,150,.3),inset 0 -2px 0 rgba(0,0,0,.5),0 0 12px rgba(232,161,58,.28)}
  .sw.rev.on .txt{color:#ffd9a0}
  .pedal.gas.rev{background:linear-gradient(180deg,#e8a13a,#a06d18 58%,#7d5512);color:#fff6e2;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.35),
               0 6px 0 #3a2a0c,0 9px 12px rgba(0,0,0,.55)}

  .foot{text-align:center;padding:7px 0 1px;font:700 8px/1.5 ui-sans-serif;letter-spacing:.20em;
    text-transform:uppercase;color:#63666d}

  /* ---- pairing screen -------------------------------------------------- */
  .pane{flex:1;display:none;flex-direction:column;min-height:0}
  .pane.on{display:flex}
  #pair{justify-content:center;align-items:center;padding:24px;gap:13px;text-align:center}
  #pair .brand{font-size:32px}
  .sub{color:#8b8d93;font-size:12px;max-width:300px;line-height:1.65;font-weight:500}
  input{background:#0b0c0f;border:0;border-radius:8px;color:var(--ink);padding:13px;font-size:21px;
    text-align:center;letter-spacing:.3em;text-transform:uppercase;width:212px;font-weight:800;outline:none;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.85)}
  input:focus{box-shadow:inset 0 3px 6px rgba(0,0,0,.85),0 0 0 2px var(--red)}
  .err{color:#ff9a93;font-size:12px;min-height:17px;font-weight:600}
  .bigpush{
    border:0;border-radius:10px;padding:14px 30px;color:#fff;
    font:800 12px/1 ui-sans-serif;letter-spacing:.18em;text-transform:uppercase;
    background:linear-gradient(180deg,#d4544c,#9c2b26);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 5px 0 #3a1310,0 8px 12px rgba(0,0,0,.5);
  }
  .bigpush:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 #3a1310}

  /* upright phones get the same object, stacked */
  @media (orientation:portrait){
    .deck{grid-template-columns:1fr;grid-template-rows:auto auto 1.25fr}
    #pedals{flex-direction:row;padding-top:17px}
    #mid{flex-direction:row;flex-wrap:wrap;padding-top:14px}
    #mid .sw,#mid .push{flex:1 1 44%}
  }
</style>
</head>
<body>

<div id="pair" class="pane on">
  <div class="brand">APEX<s>//</s></div>
  <div class="sub">Enter the 4-letter room code shown on the race screen, or scan its QR code.</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE">
  <input id="tok" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="KEY" style="font-size:16px;letter-spacing:.2em">
  <div class="err" id="perr"></div>
  <button class="bigpush" id="connect">Connect</button>
</div>

<div id="drive" class="pane">
  <div class="shell">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div class="plate">
      <span class="led" id="led"></span>
      <span class="brand">APEX<s>//</s></span>
      <span class="who">
        <span class="no" id="cnum"></span>
        <span class="nm" id="who">-</span>
        <span class="team" id="status">link</span>
      </span>
    </div>

    <div class="deck">
      <div class="well" id="steer">
        <span class="cap" id="slbl">Tilt to steer</span>
        <div class="slot" id="slot">
          <span class="notch"></span>
          <span class="knob" id="knob"></span>
        </div>
        <div class="tick"><span>L</span><span id="mode">tilt</span><span>R</span></div>
      </div>

      <div class="well" id="mid">
        <span class="cap">Controls</span>
        <div class="sw rev" id="reverse">
          <span class="rock"><i></i></span>
          <span class="txt">Reverse<b>throttle backs up</b></span>
        </div>
        <div class="sw" id="invert">
          <span class="rock"><i></i></span>
          <span class="txt">Invert<b>steering</b></span>
        </div>
        <button class="push pit" id="pit">Pit</button>
        <button class="push" id="rejoin">Rejoin</button>
        <button class="push" id="calib">Centre</button>
        <button class="push" id="toggle">Touch</button>
      </div>

      <div class="well" id="pedals">
        <span class="cap">Pedals</span>
        <div class="pedal brake" id="brake">BRAKE<small>hold</small></div>
        <div class="pedal gas" id="gas">THROTTLE<small>hold</small></div>
      </div>
    </div>

    <div class="foot" id="foot">hold in landscape · tilt like a wheel</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let ws, sendTimer, keepAlive;
let input = { s:0, g:0, b:0, r:0 };
let pitOnce = 0;
let tiltMode = true, tiltZero = null, tiltRaw = 0, touchSteer = 0;
let reverse = false;

// ---- pairing from #CODE-TOKEN
const h = decodeURIComponent(location.hash.slice(1));
if (h.includes('-')) { const [c,t] = h.split('-'); $('#code').value = c; $('#tok').value = t; }

$('#connect').onclick = () => connect($('#code').value.trim().toUpperCase(), $('#tok').value.trim().toUpperCase());
if (h.includes('-')) setTimeout(() => $('#connect').click(), 250);

function connect(code, token) {
  if (!code || !token) { $('#perr').textContent = 'Both the code and key are needed.'; return; }
  $('#perr').textContent = 'connecting…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ t:'ctrl', code, token }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'err') { $('#perr').textContent = m.msg; try{ws.close()}catch{} }
    if (m.t === 'paired') {
      $('#pair').classList.remove('on'); $('#drive').classList.add('on');
      $('#who').textContent = m.name;
      $('#cnum').textContent = m.driver.no ? '#' + m.driver.no : '';
      $('#status').textContent = m.driver.team || 'linked';
      $('#led').classList.add('on');
      document.documentElement.style.setProperty('--red', m.driver.color);
      askTilt();
      clearInterval(sendTimer);
      sendTimer = setInterval(push, 33);
      clearInterval(keepAlive);
      keepAlive = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ t: 'ping', c: 0 })), 8000);
    }
  };
  ws.onclose = () => {
    clearInterval(sendTimer); clearInterval(keepAlive);
    $('#status').textContent = 'no link';
    $('#led').classList.remove('on');
    $('#drive').classList.remove('on'); $('#pair').classList.add('on');
    $('#perr').textContent = 'Connection lost. Reconnect below.';
  };
}

const knob = $('#knob'), slot = $('#slot');
function push() {
  if (!ws || ws.readyState !== 1) return;
  const s = tiltMode ? tiltSteer() : touchSteer;
  input.s = Math.max(-1, Math.min(1, s));
  ws.send(JSON.stringify({ t:'in', s:+input.s.toFixed(3), g:input.g, b:input.b, r:input.r, p: pitOnce }));
  pitOnce = 0;
  // the knob slides in its slot: the control tells you where it is
  const travel = (slot.clientWidth - 46 - 10) / 2;
  knob.style.transform = 'translateX(' + (input.s * travel).toFixed(1) + 'px)';
}

// ---- tilt
// Which axis reads as "roll the phone like a wheel" depends on which way the
// phone was turned into landscape, and the sign flips with it. Read the real
// screen angle rather than the deprecated window.orientation, and keep a manual
// invert for handsets that still disagree.
let invert = localStorage.getItem('apex.invert') === '1';

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
  return innerWidth > innerHeight ? 90 : 0;
}

function tiltSteer() {
  if (tiltZero === null) return 0;
  let d = tiltRaw - tiltZero;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  const dead = 3, range = 26;
  if (Math.abs(d) < dead) return 0;
  const v = Math.min(1, (Math.abs(d) - dead) / (range - dead));
  // precise near centre, full lock at the edges
  return Math.sign(d) * (v * v * 0.55 + v * 0.45) * (invert ? -1 : 1);
}

function onOrient(e) {
  const beta = (typeof e.beta === 'number') ? e.beta : 0;     // front-to-back
  const gamma = (typeof e.gamma === 'number') ? e.gamma : 0;  // left-to-right
  const a = screenAngle();
  // landscape: rolling the phone shows up on beta, signed by which edge is up
  tiltRaw = a === 90 ? -beta : a === 270 ? beta : gamma;
  if (tiltZero === null) tiltZero = tiltRaw;
}

function setInvert(v) {
  invert = v;
  localStorage.setItem('apex.invert', v ? '1' : '0');
  $('#invert').classList.toggle('on', invert);
}

// iOS only hands over motion data after an explicit grant, and only on HTTPS.
function askTilt() {
  const start = () => {
    tiltZero = null;
    window.addEventListener('deviceorientation', onOrient, true);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission()
      .then(r => { r === 'granted' ? start() : setTouch(); })
      .catch(setTouch);
  } else start();
}

function setTouch() {
  tiltMode = false;
  $('#slbl').textContent = 'Drag to steer';
  $('#mode').textContent = 'touch';
  $('#toggle').textContent = 'Tilt';
  $('#foot').textContent = 'drag the slider · pedals on the right';
}

$('#calib').onclick = () => { tiltZero = tiltRaw; buzz(12); };

$('#toggle').onclick = () => {
  tiltMode = !tiltMode;
  if (tiltMode) {
    askTilt();
    $('#slbl').textContent = 'Tilt to steer';
    $('#mode').textContent = 'tilt';
    $('#toggle').textContent = 'Touch';
    $('#foot').textContent = 'hold in landscape · tilt like a wheel';
  } else setTouch();
  buzz(12);
};

$('#invert').onclick = () => { setInvert(!invert); buzz(15); };
setInvert(invert);

// Reverse is a gear, not a button: it latches, and the throttle changes colour
// so there is never any doubt which way the car is about to go.
function setReverse(v) {
  reverse = v;
  input.r = v ? 1 : 0;
  $('#reverse').classList.toggle('on', v);
  $('#gas').classList.toggle('rev', v);
  $('#gas').firstChild.nodeValue = v ? 'REVERSE' : 'THROTTLE';
}
$('#reverse').onclick = () => { setReverse(!reverse); buzz(reverse ? 28 : 14); };

$('#pit').onclick = () => {
  if (ws && ws.readyState === 1) { pitOnce = 1; buzz(25); }
};

$('#rejoin').onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'recover' }));
  buzz(20);
};

// ---- pedals
function pad(el, key) {
  const on = e => { e.preventDefault(); input[key] = 1; el.classList.add('hot'); buzz(8); };
  const off = e => { e.preventDefault(); input[key] = 0; el.classList.remove('hot'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
pad($('#gas'), 'g');
pad($('#brake'), 'b');

// ---- touch steering, by dragging the knob along its slot
function slotMove(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = slot.getBoundingClientRect();
  touchSteer = Math.max(-1, Math.min(1, ((t.clientX - r.left) / r.width - 0.5) * 2.2));
  if (tiltMode) { tiltMode = false; setTouch(); }
  e.preventDefault();
}
slot.addEventListener('touchstart', slotMove, {passive:false});
slot.addEventListener('touchmove', slotMove, {passive:false});
slot.addEventListener('touchend', e => { touchSteer = 0; e.preventDefault(); }, {passive:false});
slot.addEventListener('mousedown', slotMove);

function buzz(ms){ if (navigator.vibrate) navigator.vibrate(ms); }
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
